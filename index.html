<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Security: only Clockify's API can be contacted; no outside scripts, fonts or images can load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.clockify.me; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A21" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Quick Timer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#18202B; --muted:#5D6878; --line:#D7DDE4;
  --go:#0E6B64; --go-ink:#FFFFFF; --run:#B45309; --run-bg:#FFF4E5; --danger:#B42318;
  --radius-lg:14px; --radius-sm:8px;
  --digits: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151A21; --surface:#1E252E; --ink:#E7ECF2; --muted:#97A3B3; --line:#2C3541;
    --go:#3FB8AC; --go-ink:#0C1A19; --run:#F0A845; --run-bg:#2A2216; --danger:#F97066; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

/* Running bar: the one bold element */
.now{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.now-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-left:6px solid var(--line);border-radius:var(--radius-lg);padding:12px 12px 12px 16px}
.now-card.running{background:var(--run-bg);border-color:transparent}
.now-info{flex:1;min-width:0}
.now-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-sub{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.digits{font-family:var(--digits);font-variant-numeric:tabular-nums;font-size:34px;font-weight:300;letter-spacing:.5px;line-height:1.1}
.running .digits{color:var(--run)}
.stop{border:0;border-radius:999px;background:var(--run);color:var(--run-bg);font-weight:600;padding:12px 20px;cursor:pointer}
.stop:disabled{opacity:.5}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}

.searchbar{display:flex;gap:8px;margin-top:10px}
.search{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;outline:none;min-width:0}
.search:focus{border-color:var(--go);box-shadow:0 0 0 1px var(--go)}
.search:focus-visible{outline:none}
@media (max-width:420px){.digits{font-size:28px}.stop{padding:11px 16px}}

h2{font-size:14px;font-weight:600;color:var(--muted);margin:22px 4px 8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}

.group{margin-top:8px}
.group-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.project + .project{border-top:1px solid var(--line)}

.row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 16px;cursor:pointer;text-align:left;min-height:50px}
.row:hover,.row.active{background:color-mix(in srgb, var(--go) 9%, transparent)}
.row .label{flex:1;min-width:0}
.row .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.project-row .title{font-weight:600}
.tasks{margin-left:20px;border-left:2px solid var(--pc,var(--line))}
.tasks .row{padding-left:16px;min-height:44px}
.play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--go);color:var(--go-ink)}
.row.is-running .play{background:var(--run);color:var(--run-bg)}
.row.is-running .meta.state{color:var(--run)}
.results{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;margin-top:14px}
.results .row + .row{border-top:1px solid var(--line)}

.empty{color:var(--muted);text-align:center;padding:36px 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px;margin-top:14px}
.panel h3{margin:0 0 4px;font-size:18px}
.panel p{margin:4px 0 12px;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer}
.btn.primary{background:var(--go);color:var(--go-ink);border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;max-width:calc(100% - 32px);
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.toast.error{background:var(--danger);color:#fff}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.project-line{display:flex;align-items:stretch}
.project-line .row{flex:1;min-width:0;padding-left:4px}
.chev{flex:none;width:44px;border:0;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.chev:hover{color:var(--ink)}
.chev svg{transition:transform .15s}
.project.collapsed .chev svg{transform:rotate(-90deg)}
.project.collapsed .tasks{display:none}
.tasks{margin-left:36px}
.row.add{color:var(--go);min-height:42px}
.row.add .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px dashed var(--go);font-size:18px;line-height:1}
.results .row.add{border-top:1px solid var(--line)}
.list-tools{display:flex;justify-content:flex-end;gap:4px;margin-top:14px}
.link{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 8px;cursor:pointer;border-radius:var(--radius-sm)}
.link:hover{color:var(--ink)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;cursor:pointer;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--go)}
.searchbar .seg{margin-top:0;flex:1}
.sum-head{display:flex;align-items:center;gap:8px;margin-top:14px}
.sum-title{flex:1;text-align:center;font-weight:600}
.sum-sub{text-align:center;color:var(--muted);font-size:13px}
.nav{width:36px;height:36px}
.nav:disabled{opacity:.35;cursor:default}
.custom-dates{display:flex;gap:8px;margin-top:10px;align-items:center}
.custom-dates input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);padding:8px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;margin-top:12px}
.card h4{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:14px;margin-bottom:6px}
.crumbs .link{padding:4px 6px}
.crumbs .here{font-weight:600;padding:4px 6px}
.donut-wrap{display:flex;justify-content:center;margin:4px 0 6px}
.slice{cursor:pointer;transition:opacity .15s}
.slice:hover{opacity:.8}
.bars{display:flex;flex-direction:column;margin-top:6px}
.bar{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:11px 4px;color:inherit}
button.bar{cursor:pointer}
button.bar:hover{background:color-mix(in srgb, var(--go) 7%, transparent)}
.bar-top{display:flex;align-items:center;gap:8px}
.bar-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-time{font-variant-numeric:tabular-nums;font-weight:600}
.bar-more{color:var(--muted);width:12px;text-align:center}
.bar-bottom{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:var(--muted)}
.track{flex:1;height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.fill{height:100%;border-radius:4px;min-width:2px}
.pct{width:38px;text-align:right;font-variant-numeric:tabular-nums}
.delta{width:84px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart{width:100%;display:block;overflow:visible}
.chart text{font:11px var(--text);fill:var(--muted)}
.chart .today-lbl{fill:var(--ink);font-weight:600}
.hit{cursor:pointer;fill:transparent}
.hit:hover,.hit.sel{fill:color-mix(in srgb, var(--ink) 7%, transparent)}
.seg-rect{cursor:pointer}
.detail{font-size:14px;margin-top:10px;min-height:20px}
.detail .muted{color:var(--muted)}
.detail-list{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:13px;color:var(--muted)}
.detail-list span{display:inline-flex;align-items:center;gap:6px}
.detail-list .dot{width:8px;height:8px}
.today{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-top:14px;cursor:pointer;color:inherit}
.today:hover{border-color:color-mix(in srgb, var(--go) 45%, var(--line))}
.today-top{display:flex;align-items:baseline;gap:10px}
.today-label{font-size:14px;font-weight:600;color:var(--muted)}
.today-total{font-family:var(--digits);font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;margin-left:auto}
.today-delta{font-size:13px;color:var(--muted);white-space:nowrap}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg);margin-top:10px;gap:2px}
.stack span{height:100%;min-width:3px}
.today-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.today-legend span{display:inline-flex;align-items:center;gap:6px}
.today-legend .dot{width:8px;height:8px}
.today-legend b{color:var(--ink);font-weight:600}
.rtime{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.is-running .rtime{color:var(--run);font-weight:600}
/* Quick start tiles: pinned favorites, then recent items */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px}
.sec-head h2{margin:0}
.hint{color:var(--muted);font-size:14px;margin:0 4px 10px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{--pc:var(--muted);position:relative;display:flex;flex-direction:column;gap:2px;min-height:84px;padding:10px 10px 10px 14px;text-align:left;cursor:pointer;
  border:1px solid color-mix(in srgb, var(--pc) 30%, var(--line));border-radius:var(--radius-lg);
  background:color-mix(in srgb, var(--pc) 12%, var(--surface));box-shadow:inset 4px 0 0 var(--pc)}
.tile:hover{border-color:color-mix(in srgb, var(--pc) 60%, var(--line))}
.tile:active{transform:scale(.98)}
.tile-name{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile-foot{margin-top:auto;display:flex;align-items:center;gap:6px;min-height:18px}
.tile .rtime{flex:1}
.tile-pin{color:var(--muted);font-size:12px}
.tile.is-running{background:var(--run-bg);border-color:var(--run);box-shadow:inset 4px 0 0 var(--run)}
.tile.is-running .rtime,.tile-state{color:var(--run);font-weight:600;font-size:12px}
.tile.ghost{border-style:dashed;background:var(--surface)}
.tile-badge{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:15px;line-height:1}
.tile.ghost .tile-badge{background:var(--go);color:var(--go-ink)}
.tiles.editing .tile-name{padding-right:20px}
@media (max-width:340px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Category tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;margin-top:22px;padding:2px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tab .dot{width:8px;height:8px}
.tab .rtime:empty{display:none}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] .rtime{color:inherit}
.star{background:none;border:1.5px solid var(--go);color:var(--go)}
.row.pinned .star{background:var(--go);color:var(--go-ink)}
/* Bottom navigation */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 4px 10px;cursor:pointer;color:var(--muted);font-size:12px}
.nav-btn:hover{color:var(--ink)}
.nav-btn[aria-current="page"]{color:var(--go);font-weight:600}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="now">
    <div class="now-card" id="nowCard">
      <div class="now-info">
        <div class="now-name" id="nowName">No timer running</div>
        <div class="now-sub" id="nowSub">Tap a project or task to start</div>
      </div>
      <div class="digits" id="nowDigits">0:00:00</div>
      <button class="stop hidden" id="stopBtn">Stop</button>
    </div>
    <div class="searchbar hidden" id="summaryBar">
      <button class="icon-btn" id="backBtn" aria-label="Back to timer" title="Back to timer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="seg" role="radiogroup" aria-label="Time range" id="rangeSeg">
        <button type="button" role="radio" data-kind="today">Today</button>
        <button type="button" role="radio" data-kind="week">Week</button>
        <button type="button" role="radio" data-kind="month">Month</button>
        <button type="button" role="radio" data-kind="custom">Custom</button>
      </div>
    </div>
    <div class="searchbar" id="timerBar">
      <input class="search" id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search projects and tasks">
      <button class="icon-btn" id="createBtn" aria-label="Create" title="Create a task, project or category">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>

  <div id="settings" class="panel hidden">
    <h3>Connect to Clockify</h3>
    <p>Paste your API key from Clockify: Profile settings, then API. The key is saved only in this browser on this device.</p>
    <div class="field">
      <label for="keyInput">API key</label>
      <input id="keyInput" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your API key">
    </div>
    <div class="field hidden" id="wsField">
      <label for="wsSelect">Workspace</label>
      <select id="wsSelect"></select>
    </div>
    <div class="btns">
      <button class="btn primary" id="saveKeyBtn">Save and connect</button>
      <button class="btn hidden" id="refreshBtn">Reload projects</button>
      <button class="btn danger hidden" id="forgetBtn">Forget key</button>
      <button class="btn hidden" id="closeSettingsBtn">Close</button>
    </div>
    <p id="usage" class="hidden" style="margin:14px 0 0"></p>
  </div>

  <div id="create" class="panel hidden">
    <h3>Create</h3>
    <div class="seg" role="radiogroup" aria-label="What to create" id="createType">
      <button type="button" role="radio" data-type="task">Task</button>
      <button type="button" role="radio" data-type="project">Project</button>
      <button type="button" role="radio" data-type="client">Category</button>
    </div>
    <div class="field">
      <label for="newName" id="newNameLabel">Task name</label>
      <input id="newName" type="text" autocomplete="off" maxlength="250">
    </div>
    <div class="field" id="newProjectField">
      <label for="newProject">Project</label>
      <select id="newProject"></select>
    </div>
    <div class="field" id="newClientField">
      <label for="newClient">Category</label>
      <select id="newClient"></select>
    </div>
    <div class="field" id="newColorField">
      <span>Color</span>
      <div class="swatches" role="radiogroup" aria-label="Project color" id="swatches"></div>
    </div>
    <label class="check" id="startAfterField"><input type="checkbox" id="startAfter" checked> Start timer after creating</label>
    <div class="btns">
      <button class="btn primary" id="createGo">Create task</button>
      <button class="btn" id="createCancel">Cancel</button>
    </div>
  </div>

  <div id="list"></div>
  <div id="summary" class="hidden"></div>
</div>
<nav class="tabbar" aria-label="Main">
  <div class="tabbar-in">
    <button class="nav-btn" type="button" id="navTimer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg><span>Timer</span></button>
    <button class="nav-btn" type="button" id="navSearch"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>Search</span></button>
    <button class="nav-btn" type="button" id="navSummary"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Summary</span></button>
    <button class="nav-btn" type="button" id="navSettings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const BASE = 'https://api.clockify.me/api/v1';
const K = { key:'qt.key', cache:'qt.cache', recent:'qt.recent', fav:'qt.fav', tab:'qt.tab', ws:'qt.ws', projOpen:'qt.projOpen', sumKind:'qt.sumKind', calls:'qt.calls', backoff:'qt.backoff' };
const DAY = 86400000;

// ---------- storage (always guarded) ----------
const store = {
  get(k, fallback){ try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

// ---------- state ----------
let apiKey = store.get(K.key, '');
let cache = store.get(K.cache, null);        // {ws, userId, workspaces, projects, at}
let recent = store.get(K.recent, []);         // [{p, t}]
let fav = store.get(K.fav, []);               // pinned Quick start items [{p, t}]
let tab = store.get(K.tab, null);             // selected category tab: client name, '' for none, null for All
let editFav = false, tabsScroll = 0;
let projOpen = store.get(K.projOpen, {});     // {projectId: true|false}; default open when it has tasks
let running = null;                           // {id, projectId, taskId, start, pName, tName, color}
let calls = store.get(K.calls, []), backoffUntil = store.get(K.backoff, 0);

let projectsById = new Map();

// ---------- helpers ----------
const $ = id => document.getElementById(id);
function el(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;   // never innerHTML with data
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const byName = (a, b) => a.name.localeCompare(b.name);
const safeColor = c => (typeof c === 'string' && /^#[0-9a-f]{3,8}$/i.test(c)) ? c : null;
const isoNow = () => new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
function fmt(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
let toastTimer;
function toast(msg, isError){
  const t = $('toast'); t.textContent = msg; t.classList.toggle('error', !!isError); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 5000 : 2200);
}

  const s = document.createElementNS(ns, 'svg'); s.setAttribute('width','12'); s.setAttribute('height','12'); s.setAttribute('viewBox','0 0 12 12'); s.setAttribute('aria-hidden','true');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d','M3 1.5v9l7.5-4.5z'); p.setAttribute('fill','currentColor'); s.append(p);
  return el('span', {class:'play'}, s);
}
function starIcon(){
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg'); s.setAttribute('width','14'); s.setAttribute('height','14'); s.setAttribute('viewBox','0 0 12 12'); s.setAttribute('aria-hidden','true');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d','M6 1l1.55 3.14 3.45.5-2.5 2.44.59 3.44L6 8.9 2.91 10.52l.59-3.44L1 4.64l3.45-.5z'); p.setAttribute('fill','currentColor'); s.append(p);
  return el('span', {class:'play star'}, s);
}

// ---------- API ----------
class ApiError extends Error { constructor(status, msg){ super(msg); this.status = status; } }
function noteCall(){
  const now = Date.now();
  calls = calls.filter(t => now - t < 3600000); calls.push(now); store.set(K.calls, calls);
  if (!$('settings').classList.contains('hidden')) showUsage();
}
function callsLastHour(){ const now = Date.now(); return calls.filter(t => now - t < 3600000).length; }
function showUsage(){
  const n = callsLastHour();
  let txt = `This device made ${n} request${n === 1 ? '' : 's'} to Clockify in the last hour. Free workspaces allow 30 per hour, shared across all your devices.`;
  if (Date.now() < backoffUntil) txt += ` Auto-refresh is paused until ${fmtClock(backoffUntil)} because Clockify reported the limit.`;
  $('usage').textContent = txt;
}
const fmtClock = ms => new Date(ms).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
async function api(path, method = 'GET', body){
  let res;
  noteCall();
  try {
    res = await fetch(BASE + path, {
      method, cache:'no-store', referrerPolicy:'no-referrer',
      headers: { 'X-Api-Key': apiKey, ...(body ? {'Content-Type':'application/json'} : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch {
    throw new ApiError(0, "Couldn't reach Clockify. Check your internet connection.");
  }
  if (res.status === 401) throw new ApiError(401, "Clockify didn't accept the API key. Paste a current key in Settings.");
  if (res.status === 403) { let m = ''; try { m = (await res.json()).message || ''; } catch {} throw new ApiError(403, m || "Your Clockify role doesn't allow this action in this workspace."); }
  if (res.status === 429) {
    backoffUntil = Date.now() + 10 * 60000; store.set(K.backoff, backoffUntil);
    throw new ApiError(429, `Clockify's hourly request limit was reached. Auto-refresh is paused until ${fmtClock(backoffUntil)}.`);
  }
  if (!res.ok) { let m = ''; try { m = (await res.json()).message || ''; } catch {} throw new ApiError(res.status, m || `Clockify returned an error (${res.status}).`); }
  if (res.status === 204) return null;
  const txt = await res.text(); return txt ? JSON.parse(txt) : null;
}
async function getAll(path){
  const out = []; const size = 500;
  for (let page = 1; page < 50; page++) {
    const sep = path.includes('?') ? '&' : '?';
    const batch = await api(`${path}${sep}page=${page}&page-size=${size}`);
    out.push(...batch); if (batch.length < size) break;
  }
  return out;
}

// ---------- data ----------
function indexCache(){
  projectsById = new Map();
  if (cache) for (const p of cache.projects) projectsById.set(p.id, p);
}
async function refreshData(announce){
  const user = await api('/user');
  const workspaces = (await api('/workspaces')).map(w => ({ id:w.id, name:w.name }));
  const chosen = store.get(K.ws, '');
  const ws = workspaces.some(w => w.id === chosen) ? chosen : (user.activeWorkspace || user.defaultWorkspace || workspaces[0]?.id);
  const clients = await getAll(`/workspaces/${ws}/clients?archived=false`);
  const clientName = new Map(clients.map(c => [c.id, c.name]));
  const rawProjects = await getAll(`/workspaces/${ws}/projects?archived=false&hydrated=true`);
  const projects = rawProjects.map(p => ({
    id: p.id, name: p.name, color: safeColor(p.color),
    client: (p.clientId && clientName.get(p.clientId)) || p.clientName || '', clientId: p.clientId || null,
    tasks: (p.tasks || []).filter(t => t.status !== 'DONE').map(t => ({ id:t.id, name:t.name }))
      .sort((a,b) => a.name.localeCompare(b.name))
  })).sort((a,b) => a.name.localeCompare(b.name));
  cache = { ws, userId: user.id, weekStart: user.settings?.weekStart || 'MONDAY', workspaces, projects, clients: clients.map(c => ({ id:c.id, name:c.name })).sort(byName), at: Date.now() };
  store.set(K.cache, cache); indexCache();
  if (announce) toast(`Loaded ${projects.length} projects`);
}
// One request refreshes both today's entries and the running timer.
// mode 'user': always; 'auto': skip if refreshed in the last 3 minutes or paused; 'missing': at most once a minute.
async function sync(mode = 'auto'){
  if (!cache || !apiKey || syncing) return;
  const now = Date.now();
  if (mode !== 'user') {
    if (now < backoffUntil) return;
    if (mode === 'auto' && now - lastSync < 180000) return;
    if (mode === 'missing' && now - lastSyncTry < 60000) return;
  }
  syncing = true; lastSyncTry = now;
  const p = period('today', 0);
  try { sumCache.delete(todayKey(p)); await fetchSegs(p); }
  catch (err) { if (mode === 'user' || err.status === 401 || err.status === 429) handleError(err); }
  finally { syncing = false; renderAll(); }
}
function toRunning(e){
  const p = projectsById.get(e.projectId);
  const t = p?.tasks.find(x => x.id === e.taskId);
  return { id:e.id, projectId:e.projectId || null, taskId:e.taskId || null,
    start: Date.parse(e.timeInterval.start),
    pName: p?.name || e.project?.name || 'No project',
    tName: t?.name || e.task?.name || '',
    color: p?.color || safeColor(e.project?.color) };
}

// ---------- actions ----------
async function stopRemote(end, quiet){
  try { return await api(`/workspaces/${cache.ws}/user/${cache.userId}/time-entries`, 'PATCH', { end }); }
  catch (err) { if (quiet && (err.status === 400 || err.status === 404)) return null; throw err; }
}
async function start(p, t){
  if (busy || !cache) return;
  if (running && running.projectId === p.id && (running.taskId || null) === (t?.id || null)) { toast('Already running'); return; }
  busy = true; document.body.style.cursor = 'progress';
  const now = isoNow(), prev = running;
  const body = { start: now, projectId: p.id, billable: false };
  if (t) body.taskId = t.id;
  const post = () => api(`/workspaces/${cache.ws}/time-entries`, 'POST', body);
  try {
    let e;
    if (prev) {                        // known running timer: stop it, then start (2 requests)
      recordStopped(await stopRemote(now, true), prev, now);
      e = await post();
    } else {                           // looks idle: try starting directly (1 request)
      try { e = await post(); }
      catch (err) {                    // a timer started on another device may be in the way
        if (err.status !== 400 && err.status !== 409) throw err;
        recordStopped(await stopRemote(now, true), null, now);
        e = await post();
      }
    }
    running = toRunning(e);
    recent = [{ p:p.id, t:t?.id || null }, ...recent.filter(r => !(r.p === p.id && r.t === (t?.id || null)))].slice(0, 8);
    store.set(K.recent, recent);
    toast(`Started ${t ? t.name : p.name}`);
    query = ''; $('search').value = ''; $('search').blur();
  } catch (err) { handleError(err); }
  finally { busy = false; document.body.style.cursor = ''; renderAll(); }
}
async function stop(){
  if (busy || !running) return;
  busy = true; $('stopBtn').disabled = true;
  const r = running, now = isoNow();
  try {
    const e = await stopRemote(now, false);
    recordStopped(e, r, now);
    toast(`Stopped at ${fmt(Date.now() - r.start)}`); running = null;
  } catch (err) {
    if (err.status === 400 || err.status === 404) { running = null; toast('That timer was already stopped'); sync('user'); }
    else handleError(err);
  }
  finally { busy = false; $('stopBtn').disabled = false; renderAll(); }
}
// Add a just-finished entry to the cached data locally instead of downloading the day again.
function recordStopped(entry, fallback, endIso){
  let seg = null;
  if (entry?.timeInterval?.end) seg = entryToSeg(entry, Date.now());
  else if (fallback) seg = { ...runningSeg(fallback), e: Date.parse(endIso), live:false };
  if (!seg || !(seg.e > seg.s)) return;
  for (const v of sumCache.values()) if (seg.e > v.from && !v.segs.some(g => g.id && g.id === seg.id)) v.segs.push(seg);
}
function handleError(err){
  toast(err.message || 'Something went wrong', true);
  if (err.status === 401) showSettings(true);
}

// ---------- rendering ----------
function renderRunning(){
  const card = $('nowCard');
  if (running) {
    card.classList.add('running');
    card.style.borderLeftColor = running.color || 'var(--run)';
    $('nowName').textContent = running.tName || running.pName;
    $('nowSub').textContent = running.tName ? running.pName : 'No task';
    $('stopBtn').classList.remove('hidden');
  } else {
    card.classList.remove('running'); card.style.borderLeftColor = '';
    $('nowName').textContent = 'No timer running';
    $('nowSub').textContent = cache ? 'Tap a project or task to start' : 'Connect Clockify to begin';
    $('stopBtn').classList.add('hidden');
  }
  tick();
}
function tick(){
  const txt = running ? fmt(Date.now() - running.start) : '0:00:00';
  $('nowDigits').textContent = txt;
  document.title = running ? `${txt} ${running.tName || running.pName}` : 'Quick Timer';
}
function isRunning(p, t){ return running && running.projectId === p.id && (running.taskId || null) === (t?.id || null); }
function makeRow(p, t, opts = {}){
  const live = isRunning(p, t);
  const title = t ? t.name : p.name;
  const meta = opts.meta ?? (t ? null : (p.tasks.length ? 'Project, no task' : null));
  const pinned = editFav && isFav(p, t);
  const row = el('button', { class:`row${t ? '' : ' project-row'}${live ? ' is-running' : ''}${pinned ? ' pinned' : ''}`, type:'button', 'data-fk': favKey(p, t),
      'aria-label': `${editFav ? (pinned ? 'Unpin' : 'Pin') : 'Start'} ${title}${t ? ' in ' + p.name : ''}`,
      onclick: () => editFav ? toggleFav(p, t) : start(p, t) },
    opts.dot ? el('span', { class:'dot' }) : null,
    el('span', { class:'label' }, el('div', { class:'title', text:title }),
      live ? el('div', { class:'meta state', text:'Running' }) : (meta ? el('div', { class:'meta', text:meta }) : null)),
    el('span', { class:'rtime', 'data-k': t ? `${p.id}|${t.id}` : `P|${p.id}`, title:'Time today' }),
    editFav ? starIcon() : playIcon());
  const dot = row.querySelector('.dot'); if (dot && p.color) dot.style.background = p.color;
  setRowTime(row.querySelector('.rtime'));
  return row;
}
function isProjOpen(p){ return projOpen[p.id] ?? p.tasks.length > 0; }
function chevIcon(){
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg'); s.setAttribute('width','16'); s.setAttribute('height','16'); s.setAttribute('viewBox','0 0 16 16'); s.setAttribute('aria-hidden','true');
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d','M4 6l4 4 4-4'); p.setAttribute('fill','none'); p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','2'); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round'); s.append(p);
  return s;
}
function projectBlock(p){
  const open = isProjOpen(p);
  const proj = el('div', { class:`project${open ? '' : ' collapsed'}` });
  const count = p.tasks.length;
  const chev = el('button', { class:'chev', type:'button', 'aria-expanded': String(open),
    'aria-label': `${open ? 'Hide' : 'Show'} tasks for ${p.name}`, title: `${count} task${count === 1 ? '' : 's'}`,
    onclick: () => { const now = !isProjOpen(p); projOpen[p.id] = now; store.set(K.projOpen, projOpen);
      proj.classList.toggle('collapsed', !now); chev.setAttribute('aria-expanded', String(now));
      chev.setAttribute('aria-label', `${now ? 'Hide' : 'Show'} tasks for ${p.name}`); } }, chevIcon());
  const meta = count ? `${count} task${count === 1 ? '' : 's'}` : 'No tasks';
  proj.append(el('div', { class:'project-line' }, chev, makeRow(p, null, { dot:true, meta })));
  const tasks = el('div', { class:'tasks' });
  if (p.color) tasks.style.setProperty('--pc', p.color);
  for (const t of p.tasks) tasks.append(makeRow(p, t));
  tasks.append(addRow('Add task', () => openCreate({ type:'task', projectId:p.id })));
  proj.append(tasks);
  return proj;
}
function addRow(text, onclick){
  return el('button', { class:'row add', type:'button', onclick }, el('span', { class:'plus', text:'+', 'aria-hidden':'true' }), el('span', { class:'label', text }));
}
function setAllProjects(open){
  for (const p of cache.projects) projOpen[p.id] = open;
  store.set(K.projOpen, projOpen); renderList();
}
function renderGroups(list){
  const groups = new Map();
  for (const p of cache.projects) { const g = p.client || ''; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(p); }
  const names = [...groups.keys()].sort((a,b) => (a === '') - (b === '') || a.localeCompare(b));
  const multiple = names.length > 1;
  if (!multiple || !groups.has(tab)) tab = null;
  if (multiple) {
    const tabs = el('div', { class:'tabs', role:'tablist', 'aria-label':'Categories', onscroll: e => { tabsScroll = e.target.scrollLeft; } });
    const mk = (key, label) => {
      const b = el('button', { class:'tab', type:'button', role:'tab', 'aria-selected': String(tab === key),
          onclick: () => { tab = key; store.set(K.tab, key); renderList(); } },
        key == null ? null : el('span', { class:'dot' }), el('span', { text:label }),
        key == null ? null : el('span', { class:'rtime', 'data-k': `C|${key}` }));
      if (key != null) { b.querySelector('.dot').style.background = catColor(key); setRowTime(b.querySelector('.rtime')); }
      return b;
    };
    tabs.append(mk(null, 'All'), ...names.map(g => mk(g, g || 'No category')));
    list.append(tabs);
    tabs.scrollLeft = tabsScroll;
  }
  list.append(el('div', { class:'list-tools' },
    el('button', { class:'link', type:'button', text:'Expand all', onclick: () => setAllProjects(true) }),
    el('button', { class:'link', type:'button', text:'Collapse all', onclick: () => setAllProjects(false) })));
  for (const g of tab == null ? names : [tab]) {
    if (tab == null && (multiple || g)) list.append(el('h2', { text: g || 'No category' }));
    const body = el('div', { class:'group-body' });
    for (const p of groups.get(g)) body.append(projectBlock(p));
    list.append(el('section', { class:'group' }, body));
  }
}
// ---------- quick start (favorites + recent) ----------
const MAX_FAV = 9, QUICK = 6;
const favKey = (p, t) => `${p.id}|${t?.id || ''}`;
function isFav(p, t){ return fav.some(f => f.p === p.id && f.t === (t?.id || null)); }
function resolveRef(r){ const p = projectsById.get(r.p); const t = r.t ? p?.tasks.find(x => x.id === r.t) : null; return p && (!r.t || t) ? { p, t } : null; }
function toggleFav(p, t){
  const sel = `#list .row[data-fk="${CSS.escape(favKey(p, t))}"]`;
  const before = document.querySelector(sel)?.getBoundingClientRect().top;
  if (isFav(p, t)) fav = fav.filter(f => !(f.p === p.id && f.t === (t?.id || null)));
  else if (fav.length >= MAX_FAV) { toast(`You can pin up to ${MAX_FAV}. Unpin one first.`, true); return; }
  else fav = [...fav, { p:p.id, t:t?.id || null }];
  store.set(K.fav, fav); renderList();
  const after = document.querySelector(sel)?.getBoundingClientRect().top;   // keep the tapped row still while tiles change height
  if (before != null && after != null) window.scrollBy(0, after - before);
}
function quickItems(){
  const out = fav.map(resolveRef).filter(Boolean).map(x => ({ ...x, pinned:true }));
  for (const r of recent) {
    if (out.length >= QUICK) break;
    const x = resolveRef(r);
    if (x && !out.some(o => o.p === x.p && o.t === x.t)) out.push(x);
  }
  return out;
}
function tileEl({ p, t, pinned }){
  const live = isRunning(p, t), name = t ? t.name : p.name;
  const tile = el('button', { class:`tile${live ? ' is-running' : ''}${editFav && !pinned ? ' ghost' : ''}`, type:'button',
      title: t ? `${t.name} in ${p.name}` : p.name,
      'aria-label': `${editFav ? (pinned ? 'Unpin' : 'Pin') : 'Start'} ${name}${t ? ' in ' + p.name : ''}`,
      onclick: () => editFav ? toggleFav(p, t) : start(p, t) },
    el('span', { class:'tile-name', text:name }),
    el('span', { class:'tile-sub', text: t ? p.name : (p.client || 'Project') }),
    el('span', { class:'tile-foot' }, el('span', { class:'rtime', 'data-k': t ? `${p.id}|${t.id}` : `P|${p.id}` }),
      live ? el('span', { class:'tile-state', text:'Running' }) : (pinned && !editFav ? el('span', { class:'tile-pin', text:'★', title:'Pinned' }) : null)),
    editFav ? el('span', { class:'tile-badge', text: pinned ? '×' : '+', 'aria-hidden':'true' }) : null);
  if (p.color) tile.style.setProperty('--pc', p.color);
  setRowTime(tile.querySelector('.rtime'));
  return tile;
}
function quickSection(list){
  const items = quickItems();
  list.append(el('div', { class:'sec-head' }, el('h2', { text:'Quick start' }),
    el('button', { class:'link', type:'button', text: editFav ? 'Done' : 'Edit', 'aria-pressed': String(editFav),
      onclick: () => { editFav = !editFav; renderList(); } })));
  if (editFav) list.append(el('p', { class:'hint', text:`Tap a tile, or the star on any task below, to pin or unpin it. Up to ${MAX_FAV} pinned; recent items fill the rest.` }));
  if (!items.length) { list.append(el('p', { class:'hint', text:'Tasks you start show up here. Choose Edit to pin favorites.' })); return; }
  list.append(el('div', { class:`tiles${editFav ? ' editing' : ''}` }, items.map(tileEl)));
}
function searchItems(q){
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const p of cache.projects) {
    const cand = [{ p, t:null, hay:`${p.client} ${p.name}`, name:p.name }]
      .concat(p.tasks.map(t => ({ p, t, hay:`${p.client} ${p.name} ${t.name}`, name:t.name })));
    for (const c of cand) {
      const hay = c.hay.toLowerCase();
      if (!words.every(w => hay.includes(w))) continue;
      const n = c.name.toLowerCase();
      c.score = n.startsWith(words[0]) ? 0 : n.includes(words[0]) ? 1 : 2;
      out.push(c);
    }
  }
  return out.sort((a,b) => a.score - b.score || a.name.localeCompare(b.name)).slice(0, 60);
}
function renderList(){
  rowTimes = todayTimes();
  const list = $('list'); list.replaceChildren();
  if (!cache) { list.append(el('div', { class:'empty', text:'Add your Clockify API key in Settings to load your projects.' })); return; }
  if (!cache.projects.length) { list.append(el('div', { class:'empty', text:'No active projects in this workspace. Create one in Clockify, then choose Reload projects in Settings.' })); return; }

  if (query) {
    resultItems = searchItems(query);
    if (activeIdx >= resultItems.length) activeIdx = 0;
    const box = el('div', { class:'results', role:'listbox' });
    if (!resultItems.length) list.append(el('div', { class:'empty', text:`Nothing matches "${query}".` }));
    resultItems.forEach((c, i) => {
      const where = c.t ? (c.p.client ? `${c.p.name}, ${c.p.client}` : c.p.name) : (c.p.client || 'Project');
      const row = makeRow(c.p, c.t, { dot:true, meta:where });
      if (i === activeIdx) row.classList.add('active');
      box.append(row);
    });
    box.append(addRow(`Create "${query}"`, () => openCreate({ type:'task', name:query })));
    list.append(box); return;

const PALETTE = ['#2F7FD8','#E4572E','#2E9E5B','#E0A21B','#8E5BD8','#17A2A2','#D65DB1','#7C8B2C','#B5693C','#5C6BC0'];

  card.append(el('div', { class:'sum-sub', text: `${dTot >= 0 ? '▲' : '▼'} ${dur(Math.abs(dTot))} ${p.cmpLabel}` }));

  // ranked bars
  const bars = el('div', { class:'bars' });
  const max = Math.max(1, ...items.map(i => i.ms));
  for (const it of items) {
    const d = it.ms - it.prev;
    const deltaTxt = !it.prev ? (it.ms ? 'new' : '') : !it.ms ? `▼ ${dur(it.prev)}` : Math.abs(d) < 60000 ? '±0m' : `${d > 0 ? '▲' : '▼'} ${dur(Math.abs(d))}`;
    const drill = canDrill && it.ms > 0;
    const fill = el('div', { class:'fill' }); fill.style.width = `${it.ms / max * 100}%`; fill.style.background = it.col;
    const dot = el('span', { class:'dot' }); dot.style.background = it.col;
    const row = el(drill ? 'button' : 'div', { class:'bar', type: drill ? 'button' : null, onclick: drill ? () => drillTo(it.key, p, segs) : null,
        'aria-label': drill ? `${it.name}, ${dur(it.ms)}. Show breakdown` : null },
      el('div', { class:'bar-top' }, dot, el('span', { class:'bar-name', text: it.name }), el('span', { class:'bar-time', text: dur(it.ms) }),
        el('span', { class:'bar-more', text: drill ? '›' : '' })),
      el('div', { class:'bar-bottom' }, el('div', { class:'track' }, fill),
        el('span', { class:'pct', text: total ? `${Math.round(it.ms / total * 100)}%` : '' }),
        el('span', { class:'delta', text: deltaTxt, title: p.cmpLabel })));
    bars.append(row);
  }
  card.append(bars);
  out.push(card);

  // ---- card 2: daily columns or day timeline
  const colorOf = new Map(slices.map(s => [s.key, s.col]));
  const nameOf = new Map(items.map(i => [i.key, i.name]));
  const keyFor = g => { const k = g.keys[sum.path.length]; return colorOf.has(k) ? k : OTHER; };
  const mine = segs.filter(g => segMatches(g, sum.path));
  const chartCard = el('div', { class:'card' });
  out.push(chartCard);
  box.replaceChildren(...out);
  const width = Math.max(260, chartCard.clientWidth - 32);
  if (p.days === 1) renderTimeline(chartCard, width, p, mine, keyFor, colorOf, nameOf);
  else if (p.days <= 62) renderColumns(chartCard, width, p, mine, keyFor, colorOf, nameOf, slices);
  else chartCard.append(el('div', { class:'sum-sub', text:'The daily chart shows ranges of up to 62 days. Pick a shorter range to see it.' }));
}
function drillTo(key, p, segs){ if (sum.path.length < 2) { sum.path = [...sum.path, key]; sum.selDay = sum.selSeg = null; renderSummary(p, segs); window.scrollTo({ top:0 }); } }

function renderColumns(card, W, p, segs, keyFor, colorOf, nameOf, slices){
  card.append(el('h4', { text:'Hours per day' }));
  const n = p.days, H = 190, padL = 30, padB = 22, padT = 6, plotW = W - padL, plotH = H - padB - padT;
  const days = [];
  for (let i = 0; i < n; i++) {
    const ds = addDays(p.a, i), de = addDays(p.a, i + 1), m = new Map(); let tot = 0;
    for (const g of segs) { const o = overlap(g.s, g.e, +ds, Math.min(+de, +p.effB)); if (o) { const k = keyFor(g); m.set(k, (m.get(k) || 0) + o); tot += o; } }
    days.push({ ds, m, tot });
  }
  const maxH = Math.max(1, ...days.map(d => d.tot)) / 3600000;
  const step = [1,2,3,4,6,8,12,24].find(s => maxH / s <= 4) || 24;
  const top = Math.max(step, Math.ceil(maxH / step) * step);
  const y = h => padT + plotH - h / top * plotH;
  const chart = svg('svg', { class:'chart', width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':'Hours per day chart' });
  for (let h = 0; h <= top; h += step) {
    chart.append(svg('line', { x1:padL, x2:W, y1:y(h), y2:y(h), style:'stroke:var(--line);stroke-width:1' }));
    chart.append(svg('text', { x:padL - 6, y:y(h) + 4, 'text-anchor':'end', text:`${h}h` }));
  }
  const slot = plotW / n, bw = Math.max(3, Math.min(34, slot * 0.68));
  const order = [...slices.map(s => s.key)];
  const todayKey = ymd(new Date());
  const labelEvery = n <= 7 ? 1 : n <= 16 ? 2 : Math.ceil(n / 8);
  const detail = el('div', { class:'detail' });
  days.forEach((d, i) => {
    const x = padL + i * slot + (slot - bw) / 2;
    let acc = 0;
    const g = svg('g');
    for (const k of order) {
      const v = d.m.get(k); if (!v) continue;
      const h = v / 3600000;
      g.append(svg('rect', { x, y: y(acc + h), width:bw, height: Math.max(0.5, y(acc) - y(acc + h)), rx: 2, style:`fill:${colorOf.get(k)}` }));
      acc += h;
    }
    const hit = svg('rect', { class:`hit${sum.selDay === i ? ' sel' : ''}`, x: padL + i * slot, y: padT, width: slot, height: plotH + padB, rx: 4,
      onclick: () => { sum.selDay = i; chart.querySelectorAll('.hit').forEach((h2, j) => h2.classList.toggle('sel', j === i)); showDay(detail, d, colorOf, nameOf, order); } },
      svg('title', { text: `${fmtD(d.ds, { weekday:'short', month:'short', day:'numeric' })}: ${dur(d.tot)}` }));
    chart.append(hit, g);
    if (i % labelEvery === 0 || n <= 7) {
      const isToday = ymd(d.ds) === todayKey;
      const lbl = n <= 7 ? fmtD(d.ds, { weekday:'short' }) : String(d.ds.getDate());
      chart.append(svg('text', { x: padL + i * slot + slot / 2, y: H - 6, 'text-anchor':'middle', class: isToday ? 'today-lbl' : null, text: lbl }));
    }
    g.style.pointerEvents = 'none';
  });
  card.append(chart, detail);
  const avgDays = days.filter(d => +d.ds < +p.effB).length || 1;
  const total = days.reduce((t, d) => t + d.tot, 0);
  if (sum.selDay != null && days[sum.selDay]) showDay(detail, days[sum.selDay], colorOf, nameOf, order);
  else detail.append(el('span', { class:'muted', text:`Average ${dur(total / avgDays)} per day. Tap a day for its breakdown.` }));
}
function showDay(detail, d, colorOf, nameOf, order){
  const list = el('div', { class:'detail-list' });
  for (const k of order) { const v = d.m.get(k); if (!v) continue;
    const dot = el('span', { class:'dot' }); dot.style.background = colorOf.get(k);
    list.append(el('span', {}, dot, `${k === OTHER ? 'Other' : nameOf.get(k)} ${dur(v)}`)); }
  detail.replaceChildren(el('strong', { text: `${fmtD(d.ds, { weekday:'long', month:'short', day:'numeric' })}: ${dur(d.tot)}` }), list);
}
function renderTimeline(card, W, p, segs, keyFor, colorOf, nameOf){
  card.append(el('h4', { text:'Timeline' }));
  const H = 64, barY = 6, barH = 34, x = t => (t - +p.a) / 86400000 * W;
  const chart = svg('svg', { class:'chart', width:W, height:H, viewBox:`0 0 ${W} ${H}`, role:'img', 'aria-label':'Timeline of the day' });
  chart.append(svg('rect', { x:0, y:barY, width:W, height:barH, rx:6, style:'fill:var(--bg)' }));
  const detail = el('div', { class:'detail' });
  const parts = segs.map(g => ({ g, s: Math.max(g.s, +p.a), e: Math.min(g.e, +p.effB) })).filter(q => q.e > q.s).sort((a, b) => a.s - b.s);
  parts.forEach((q, i) => {
    const k = keyFor(q.g);
    const r = svg('rect', { class:'seg-rect', x: x(q.s), y: barY, width: Math.max(1.5, x(q.e) - x(q.s)), height: barH, style:`fill:${colorOf.get(k)}`,
      onclick: () => showSeg(detail, q) }, svg('title', { text: `${q.g.names[2] !== 'No task' ? q.g.names[2] + ', ' : ''}${q.g.names[1]}: ${fmtT(q.s)} to ${fmtT(q.e)}` }));
    chart.append(r);
  });
  if (p.inProgress) chart.append(svg('line', { x1: x(+p.now), x2: x(+p.now), y1: barY - 3, y2: barY + barH + 3, style:'stroke:var(--ink);stroke-width:1.5' }));
  const hs = W < 520 ? 6 : 3;
  for (let h = 0; h <= 24; h += hs) {
    const tx = h / 24 * W;
    chart.append(svg('text', { x: Math.min(Math.max(tx, 10), W - 10), y: H - 6, 'text-anchor':'middle',
      text: new Date(2000, 0, 1, h % 24).toLocaleTimeString(undefined, { hour:'numeric' }) }));
  }
  card.append(chart, detail);
  detail.append(el('span', { class:'muted', text: parts.length ? 'Tap a block to see what it was.' : 'Nothing tracked yet.' }));
}
function showSeg(detail, q){
  const t = q.g.names[2] !== 'No task' ? q.g.names[2] : q.g.names[1];
  detail.replaceChildren(el('strong', { text: t }), el('span', { class:'muted', text: `  ${q.g.names[2] !== 'No task' ? q.g.names[1] + ', ' : ''}${fmtT(q.s)} to ${fmtT(q.e)} (${dur(q.e - q.s)})` }));
}

function setView(v){
  view = v;
  const sumV = v === 'summary';
  $('timerBar').classList.toggle('hidden', sumV); $('summaryBar').classList.toggle('hidden', !sumV);
  $('list').classList.toggle('hidden', sumV); $('summary').classList.toggle('hidden', !sumV);
  $('create').classList.add('hidden'); $('settings').classList.add('hidden');
  if (sumV) { loadSummary(); window.scrollTo({ top:0 }); } else renderList();
  updateNav();
}
function updateNav(){
  const settingsOpen = !$('settings').classList.contains('hidden');
  const cur = view === 'summary' ? 'navSummary' : settingsOpen ? 'navSettings' : 'navTimer';
  for (const id of ['navTimer','navSearch','navSummary','navSettings']) { if (id === cur) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current'); }
}
function toTimer(){ if (view !== 'timer') setView('timer'); showSettings(false); closeCreate(); window.scrollTo({ top:0 }); }
$('navTimer').addEventListener('click', toTimer);
$('navSearch').addEventListener('click', () => { toTimer(); $('search').focus(); });
$('navSummary').addEventListener('click', () => setView('summary'));
$('navSettings').addEventListener('click', () => {
  if (view === 'summary') setView('timer');
  const open = $('settings').classList.contains('hidden');
  showSettings(open); if (open) window.scrollTo({ top:0 });
});
$('backBtn').addEventListener('click', () => setView('timer'));
document.querySelectorAll('#rangeSeg button').forEach(b => b.addEventListener('click', () => {
  sum.kind = b.dataset.kind; sum.offset = 0; sum.selDay = sum.selSeg = null; store.set(K.sumKind, sum.kind); loadSummary();
}));
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view === 'summary') loadSummary(); }, 250); });

// ---------- today card ----------
function todayKey(p){ return `${cache.ws}|${+addDays(p.pa, -1)}|${+p.b}`; }
function todayCardEl(){
  const btn = el('button', { class:'today', id:'todayCard', type:'button', 'aria-label':"Open today's summary",
    onclick: () => { sum.kind = 'today'; sum.offset = 0; sum.selDay = sum.selSeg = null; store.set(K.sumKind, 'today'); setView('summary'); } });
  const p = period('today', 0);
  const v = cache ? sumCache.get(todayKey(p)) : null;
  if (!v) {
    const paused = Date.now() < backoffUntil;
    btn.append(el('div', { class:'today-top' }, el('span', { class:'today-label', text:'Today' }),
      el('span', { class:'today-delta', text: paused ? `Paused until ${fmtClock(backoffUntil)}` : 'Loading…' })));
    if (cache && !paused) setTimeout(() => sync('missing'), 0);
    return btn;
  }
  const root = buildTree(withLive(v.segs), p);
  // Categories stay grouped; time with no category is shown per project instead of one lumped item.
  const cats = [];
  for (const c of root.children.values()) {
    if (c.ms <= 0) continue;
    if (c.key === '') for (const pr of c.children.values()) { if (pr.ms > 0) cats.push({ name: pr.name, ms: pr.ms, col: pr.color || null }); }
    else cats.push({ name: c.name, ms: c.ms, col: catColor(c.key) });
  }
  cats.sort((x, y) => y.ms - x.ms);
  cats.forEach((c, i) => { if (!c.col) c.col = PALETTE[i % PALETTE.length]; });
  const d = root.ms - root.prev;
  btn.append(el('div', { class:'today-top' },
    el('span', { class:'today-label', text:'Today' }),
    el('span', { class:'today-delta', text: root.prev || root.ms ? `${Math.abs(d) < 60000 ? '±0m' : (d > 0 ? '▲ ' : '▼ ') + dur(Math.abs(d))} vs yesterday` : '' }),
    el('span', { class:'today-total', text: dur(root.ms) })));
  if (!root.ms) { btn.append(el('div', { class:'today-legend', text:'Nothing tracked yet today.' })); return btn; }
  const stack = el('div', { class:'stack', 'aria-hidden':'true' });
  const legend = el('div', { class:'today-legend' });
  const SHOW = 8;
  cats.forEach((c, i) => {
    const col = c.col;
    const part = el('span', { title:`${c.name}: ${dur(c.ms)}` }); part.style.flex = String(c.ms); part.style.background = col; stack.append(part);
    if (i < SHOW) { const dot = el('span', { class:'dot' }); dot.style.background = col; legend.append(el('span', {}, dot, `${c.name} `, el('b', { text: dur(c.ms) }))); }
  });
  if (cats.length > SHOW) legend.append(el('span', { text:`+${cats.length - SHOW} more` }));
  btn.append(stack, legend);
  return btn;
}
function updateTodayCard(){
  const cur = $('todayCard');
  if (cur && view === 'timer' && !query) cur.replaceWith(todayCardEl());
}
// Time spent today per task and per project, from the data the Today card already has (no requests).
let rowTimes = new Map();
function todayTimes(){
  const m = new Map();
  if (!cache) return m;
  const p = period('today', 0), v = sumCache.get(todayKey(p));
  if (!v) return m;
  const a = +p.a, b = Date.now();
  for (const g of withLive(v.segs)) {
    const o = overlap(g.s, g.e, a, b); if (!o) continue;
    const pid = g.keys[1], tk = `${pid}|${g.keys[2]}`, pk = `P|${pid}`, ck = `C|${g.keys[0]}`;
    m.set(tk, (m.get(tk) || 0) + o); m.set(pk, (m.get(pk) || 0) + o); m.set(ck, (m.get(ck) || 0) + o);
  }
  return m;
}
function setRowTime(span){
  if (!span) return;
  const ms = rowTimes.get(span.dataset.k) || 0;
  span.textContent = ms >= 60000 ? dur(ms) : '';
  span.setAttribute('aria-label', ms >= 60000 ? `${dur(ms)} today` : '');
}
function refreshRowTimes(){ rowTimes = todayTimes(); document.querySelectorAll('#list .rtime').forEach(setRowTime); }
setInterval(() => { if (running) { updateTodayCard(); refreshRowTimes(); } }, 15000);   // local re-draw only, no requests

// ---------- boot ----------
indexCache(); renderAll();
if (!apiKey) showSettings(true);
else if (!cache) connect();
else {
  sync('auto');
  if ((!cache.clients || Date.now() - cache.at > DAY) && Date.now() >= backoffUntil) refreshData(false).then(renderAll).catch(handleError);
}
})();
</script>
</body>
